name: Keepalive database

# Mantiene attivo il progetto database (piano gratuito) inviando una richiesta
# ogni 3 giorni, anche se nessuno apre l'app. Il piano gratuito sospende il
# progetto dopo 7 giorni senza attività.
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping progetto
        env:
          PROJECT_URL: https://vdfglzacnhtbzvczzpni.supabase.co
          PUBLISHABLE_KEY: sb_publishable_DH8l6Hu5AaOPYvv0TImEpw_-EXAK2Qy
        run: |
          set -e
          echo "Ping auth health…"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PROJECT_URL/auth/v1/health")
          echo "auth/v1/health -> $code"

          echo "Ping API REST…"
          code2=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $PUBLISHABLE_KEY" \
            "$PROJECT_URL/rest/v1/?select=1")
          echo "rest/v1 -> $code2"

          # Il progetto è considerato attivo se risponde (anche 401/404):
          # un progetto sospeso non risponde affatto.
          if [ "$code" = "000" ] && [ "$code2" = "000" ]; then
            echo "::error::Il progetto non risponde: potrebbe essere sospeso."
            exit 1
          fi
          echo "Progetto attivo."
